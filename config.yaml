# Copy to config.yaml. Defines WHICH model is used for WHICH purpose.
# Each purpose is independent — swap models per purpose without touching code.
# Secrets stay in .env; this file only names providers/models/params.

models:

  # Stage 1: topic -> full narration script (creative, high quality)
  script_generation:
    provider: anthropic
    # prod default. Dev: set VP_LLM_MODEL=claude-haiku-4-5-20251001 in .env
    # to override this + segmentation_direction for cheaper iteration.
    model: claude-sonnet-4-6
    api_key_env: ANTHROPIC_API_KEY
    params: { max_tokens: 4000, temperature: 0.9 }

  # Stage 2: approved script -> segmentation + control-signal JSON
  # (structured, per-chapter; see planning/09 + planning/04)
  segmentation_direction:
    provider: anthropic
    model: claude-sonnet-4-6      # prod default; VP_LLM_MODEL overrides (dev)
    api_key_env: ANTHROPIC_API_KEY
    params: { max_tokens: 8000, temperature: 0.4 }

  # Editorial sound design: approved doc + voice alignment -> sparse SFX
  # cues from the curated 20-effect palette (plan/build-sound-effects.md).
  # Low temperature: the job is RESTRAINT and consistency, not creativity.
  # prod default sonnet-4-6; dev: VP_LLM_MODEL overrides (see config.py).
  sound_design:
    provider: anthropic
    model: claude-sonnet-4-6
    api_key_env: ANTHROPIC_API_KEY
    params: { max_tokens: 2000, temperature: 0.2 }

  # Background music selection: picks ONE track from assets/music/catalog.json
  # based on video niche/tone. Haiku is sufficient — trivial closed-vocab pick.
  # Offline/failure -> no music (silence), never a crash. Optional stage.
  music_design:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    api_key_env: ANTHROPIC_API_KEY
    params: { max_tokens: 200, temperature: 0.2 }

  # Title variants / description / tags / chapters
  metadata_text:
    provider: anthropic
    model: claude-sonnet-4-6
    api_key_env: ANTHROPIC_API_KEY
    params: { max_tokens: 1500, temperature: 0.8 }

  # Voiceover. CONTINUOUS per-chapter synthesis (natural model-driven
  # pacing); segments are sliced from the continuous read, not stitched.
  tts_audio:
    provider: google
    # 3.1-flash-tts: free-tier OK, dramatic spacious cadence (matches the
    # approved Leda reference). pro-tts is free-tier quota 0.
    model: gemini-3.1-flash-tts-preview
    api_key_env: GEMINI_API_KEY
    # extra rotation keys: GEMINI_API_KEY_1..N in .env. Rotated per chapter + 429 cooldown.
    voice_name: Leda                    # locked: approved voice
    # AI-Studio-style framing prepended to every chapter (the prompt the
    # user validated). Override per-video via video_meta.tts_scene/tts_context.
    tts_scene: "A dramatic monologue or a suspenseful narrative voiceover."
    tts_context: >-
      A psychological thriller, a drama film, or a modern audio drama.
      It captures the exact moment of a shattered illusion - the quiet,
      painful epiphany where a victim realizes they have been subtly
      brainwashed and controlled over a long period.
    params: { temperature: 1.0 }

  # Word-level timing — local, no API. See planning/06.
  forced_alignment:
    provider: local
    engine: stable-ts
    model: base            # base|small|medium ; fallback engine: mfa

# Channel-wide defaults applied to every video. Code constants
# (vp.pipeline.script_gen._CHANNEL_VIDEO_META) cover the niche-neutral
# look numbers; the mood-coded base_color_grade lives here so it's a
# config knob, not a hardcoded bias.
channel:
  # Default color grade. Must be one of schema.enums.COLOR_GRADE
  # (cold_isolation, warm_comfort, warm_comfort_dark, clinical,
  # surveillance, memory, threat, madness, revelation, death, dream,
  # interrogation, nostalgia). Per-segment color_grade_override still
  # wins. Pick a grade that matches your channel's tone; "clinical" is
  # the most niche-neutral.
  base_color_grade: cold_isolation

# Brand voice for thumbnail prompts (metadata.json -> thumbnail_prompt).
# Thumbnails are now produced manually: paste `thumbnail_prompt` from
# metadata.json into Gemini's free web UI (nano banana / gemini-2.5-flash-image).
# These fields are enforced on EVERY prompt regardless of video topic, so
# the channel looks like one channel even as subjects change. Tune freely.
branding:
  thumbnail:
    # Two hex colors. First = primary accent (highlights, rim light, single
    # focal pop). Second = dominant background tone. Keep the rest of the
    # frame muted so the accent reads instantly at thumbnail size.
    accent_colors: ["#E84545", "#0F0F1A"]
    # Short style descriptor — one phrase. Sets the visual genre.
    theme: "cinematic dark psychology"
    # Emotional register the image should convey.
    mood: "tense, eerie, intimate, unsettling"
    # Lighting recipe. Specific beats lighting; vague reads as default-AI.
    lighting: "low-key chiaroscuro, single hard rim light, deep blacks"
    # Rendering / lens / medium.
    style: "photoreal, 35mm, shallow depth of field, cinematic film grain"
    # Hard exclusions the model must obey.
    negative: "no text, no captions, no lettering, no logos, no watermarks, no busy backgrounds, no collage, no multiple subjects"

# Gemini rate limiting — applies to TTS + LLM fallback calls combined.
# tier: free  → proactive per-key sliding-window cap at `rpm` req/min.
# tier: paid (or section absent) → no throttling; existing 429-reactive
#   logic handles bursts without any added delay.
gemini:
  tier: free   # free | paid
  rpm: 10      # requests per minute per key (Gemini free-tier default)

# Non-model services (keys in .env): PEXELS_API_KEY, YT_* (optional).
